<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PartyBox Simulator</title>
  <style>
    :root { --bg: #0c0a14; --text: #f4f1ff; --muted: #a59fc2; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
    header { display: flex; gap: 12px; align-items: center; padding: 12px 16px; flex-wrap: wrap; }
    header a { color: #ffcc33; }
    .phones { display: flex; gap: 16px; padding: 0 16px 16px; overflow-x: auto; }
    .phone { flex: none; display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 0.85rem; }
    iframe { width: 360px; height: 740px; border: 3px solid #2d2644; border-radius: 24px; background: #14111f; }
  </style>
</head>
<body>
  <header>
    <strong>PartyBox simulator</strong>
    <span>Each frame is a separate player. Create a room in Phone 1, then join it from the others.</span>
    <span>Phones: <a href="?n=2">2</a> · <a href="?n=3">3</a> · <a href="?n=4">4</a> · <a href="?n=6">6</a></span>
  </header>
  <div class="phones" id="phones"></div>
  <script>
    const n = Math.min(8, Math.max(1, Number(new URLSearchParams(location.search).get('n')) || 3));
    document.getElementById('phones').innerHTML = Array.from({ length: n }, (_, i) =>
      `<div class="phone">Phone ${i + 1}<iframe src="/?seat=${i + 1}"></iframe></div>`).join('');
  </script>
</body>
</html>
