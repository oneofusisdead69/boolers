<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14111f">
  <link rel="icon" type="image/png" href="/icons/favicon.png">
  <title>Pass and play · Bool Games</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    /* Pass-and-play extras on top of the app's own styles. */
    .home-link { color: var(--muted); text-align: center; font-size: 0.95rem; }
    .holder { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; align-items: center; }
    .holder span { color: var(--muted); font-size: 0.85rem; width: 100%; text-align: center; }
    .holder button { width: auto; padding: 8px 12px; font-size: 0.9rem; background: var(--card-2); color: var(--text); border: 2px solid transparent; }
    .holder button.selected { border-color: var(--accent); }
    .holder button.hint { box-shadow: 0 0 0 2px var(--ok); }
    .drink-alert .who { font-size: 1.6rem; font-weight: 800; }
  </style>
</head>
<body>
  <main id="app"></main>
  <div id="drink-alert" class="drink-alert" hidden></div>
  <script src="/analytics.js"></script>
  <script src="/prefs.js"></script>
  <script src="/looks.js"></script>
  <script src="/room-styles.js"></script>
  <script src="/pb.js"></script>
  <script src="/shared/bundle.js"></script>
  <script>
    // Pass and play for any game: runs the real rules (from /shared/bundle.js) and the real game
    // screens (from /games/<id>.js) on one phone. Each screen is drawn for whoever has to act
    // next, and taps act as that player.
    const params = new URLSearchParams(location.search);
    const gameId = params.get('game');
    const game = __req(gameId);
    const { createContext } = __req('context');
    const $app = document.getElementById('app');
    const $alert = document.getElementById('drink-alert');

    // What one phone can't do (secret hands, tap races) is switched off, and who acts is
    // worked out from the game state.
    const LOCAL = {
      rideTheBus: {
        locked: { bluff: false },
        actor(room, holder) {
          const g = room.game;
          if (g.phase === 'guess') return g.order[g.turnIdx];
          if (g.phase === 'give') return g.give.from;
          if (g.phase === 'bus' || g.phase === 'over') return g.bus.riderId;
          return holder || g.order[0];
        },
        // In the pyramid anyone may play, so the phone shows one player's cards at a time.
        switchable: (room) => room.game.phase === 'pyramid',
        hint(room, id) {
          const g = room.game;
          const n = g.pyramid?.flipped;
          if (!n) return false;
          let left = n - 1;
          for (const row of g.pyramid.rows) {
            if (left < row.length) return g.hands[id].some((c) => c.rank === row[left].rank);
            left -= row.length;
          }
          return false;
        },
      },
      darts: {
        locked: {},
        // The thrower (games/darts.js keeps their place in the order), or whoever's handing out sips.
        actor(room) {
          const g = room.game;
          return g.phase === 'give' && g.give ? g.give.from : g.order[g.turnIdx];
        },
      },
      kingsCup: {
        locked: { reactions: false },
        actor: (room) => room.game.turnId,
      },
      aceRace: {
        locked: {},
        // Betting: tap whose bet it is. Payout: each winner in turn hands out their sips.
        actor(room, holder) {
          const g = room.game;
          if (g.phase === 'payout') return Object.keys(g.payout).find((id) => !g.payout[id].done) || g.order[0];
          return (g.phase === 'betting' && holder) || g.order[0];
        },
        switchable: (room) => room.game.phase === 'betting',
        holderLabel: 'Whose bet?',
        hint: (room, id) => room.game.phase === 'betting' && !room.game.bets[id],
      },
      horseRace: {
        locked: { jockey: false }, // riders all tap at once: needs a phone each
        actor(room, holder) {
          const g = room.game;
          if (g.phase === 'payout') return Object.keys(g.payout).find((id) => !g.payout[id].done) || g.order[0];
          return (g.phase === 'betting' && holder) || g.order[0];
        },
        switchable: (room) => room.game.phase === 'betting',
        holderLabel: 'Whose bet?',
        hint: (room, id) => room.game.phase === 'betting' && !room.game.bets[id],
      },
      shotPoker: {
        locked: {},
        // Betting goes to whoever's turn it is; after a hand, pick who's holding the phone to pay.
        actor(room, holder) {
          const g = room.game;
          if (g.phase === 'betting') return g.turnId;
          return holder || Object.keys(g.debts).find((id) => !g.debts[id].paid) || g.order[0];
        },
        switchable: (room) => room.game.phase === 'showdown',
        hint: (room, id) => room.game.debts[id] && !room.game.debts[id].paid,
      },
    };
    // Games played since this page opened, for the water reminder; and a number for each game.
    const localNight = {};
    let localGames = 0;
    // The room style (dive bar, tavern…) is remembered on this phone.
    let roomStyle = 'classic';
    try { roomStyle = ROOM_STYLES.roomOf(localStorage.getItem('local-room-style')) || 'classic'; } catch {}
    if (!ROOM_STYLES.PICKABLE.includes(roomStyle)) roomStyle = 'classic';
    // Rooms whose look changes on its own (the Lighthouse's weather) do it here too: a new mood
    // every few minutes while a game is on, as in an online room.
    let mood = null;
    let moodUntil = 0;
    function look() {
      const moods = ROOM_STYLES.STYLES[roomStyle]?.moods;
      if (!moods) return roomStyle;
      if (!moods.some(([id]) => id === mood) || (room?.game && Date.now() >= moodUntil)) {
        mood = ROOM_STYLES.pickMood(roomStyle, mood);
        moodUntil = Date.now() + (6 + Math.random() * 6) * 60 * 1000;
      }
      return mood;
    }
    setInterval(() => ROOM_STYLES.apply(look()), 15 * 1000);
    const howToPlay = (rules = []) => (rules.length
      ? `<details class="how-to"><summary>📖 How to play</summary><ul>${rules.map((r) => `<li>${PB.esc(r)}</li>`).join('')}</ul></details>` : '');

    // Otherwise: whoever's turn the game says it is (games name it turnId, or rollerId for the
    // dice), or the host.
    const local = LOCAL[gameId] || { locked: {}, actor: (room) => room.game.turnId || room.game.rollerId || room.hostId };
    const options = (game.options || []).filter((o) => !(o.id in local.locked));

    const storeKey = `local-${gameId}`;
    let names = ['Alex', 'Bea', 'Cam'];
    let opts = Object.fromEntries(options.map((o) => [o.id, o.default]));
    try {
      const saved = JSON.parse(localStorage.getItem(storeKey));
      if (Array.isArray(saved?.names) && saved.names.length >= game.minPlayers) names = saved.names;
      for (const o of options) if (o.choices.some((c) => c.value === saved?.opts?.[o.id])) opts[o.id] = saved.opts[o.id];
    } catch {}

    let room = null;
    let lastPlayers = []; // the last game's players, for tonight's tab
    let ctx = null;
    let holder = null; // whose cards are showing, where anyone may act
    const alerts = [];
    const esc = PB.esc;
    const nm = (id) => room.players.find((p) => p.id === id)?.name ?? '?';
    const actorId = () => local.actor(room, holder);

    PB.passAndPlay = true;
    PB.send = (type, data) => {
      const p = room.players.find((x) => x.id === actorId());
      room.hostId = p.id; // whoever holds the phone can do the host's jobs (like flipping)
      game.handle(room, p, { type, ...data }, ctx);
      render();
    };
    PB.redraw = () => render();
    document.title = `${game.name} · Bool Games`;

    // ---------- Drink alerts (one at a time, naming who drinks) ----------

    function showAlert() {
      if (!$alert.hidden || !alerts.length) return;
      const a = alerts.shift();
      $alert.innerHTML = `<div class="who">${esc(a.who)}</div><div class="big">🍺 ${esc(a.title)}</div><div>${esc(a.reason)}</div><small>tap to dismiss</small>`;
      $alert.hidden = false;
      navigator.vibrate?.([200, 100, 200]);
      Prefs.play('drink');
    }
    $alert.onclick = () => { $alert.hidden = true; showAlert(); };

    // ---------- Setup ----------

    function renderSetup(error = '') {
      if (room) {
        ctx.clearTimer(room);
        lastPlayers = room.players;
      }
      room = null;
      $app.innerHTML = `
        <h1 class="ls-l"><span class="logo-emoji">🍻</span> Bool <span>Games</span> <span class="logo-emoji">🎲</span></h1>
        <p class="tagline ls-l">${esc(game.name)} · pass and play</p>
        <a class="home-link" href="/">← Back to Bool Games</a>
        ${Prefs.button()}
        ${Prefs.feedbackButton()}
        <div class="card ls-l">
          <h2>${esc(game.name)}</h2>
          <p class="muted">${esc(game.description)}</p>
          ${howToPlay(game.rules)}
          ${game.custom?.length ? `
            <div class="custom-row">
              <small>${PB.hasCustom(gameId) ? '✏️ Using your edits' : 'Write your own questions and rules'}</small>
              <button class="secondary" id="customize">✏️ Customize</button>
            </div>` : ''}
          ${options.filter((o) => PB.optionShown(o, opts)).map((o) => `
            <div class="option">
              <span class="muted">${esc(o.label)}</span>
              <div class="segmented">${o.choices.map((c) => `
                <button class="${c.value === opts[o.id] ? 'selected' : ''}" data-opt="${esc(o.id)}" data-val='${esc(JSON.stringify(c.value))}'>${esc(c.label)}</button>`).join('')}</div>
            </div>`).join('')}
        </div>
        <div class="card">
          <h2>Players, in turn order</h2>
          ${names.map((n, i) => `
            <div class="name-row-l">
              <input id="name-${i}" value="${esc(n)}" maxlength="16" autocomplete="off" aria-label="Player ${i + 1} name">
              <button class="secondary" data-remove="${i}" aria-label="Remove player" ${names.length <= game.minPlayers ? 'disabled' : ''}>✕</button>
            </div>`).join('')}
          <button class="secondary" id="add" ${names.length >= 12 ? 'disabled' : ''}>Add player</button>
        </div>
        <div class="card room-style-card">
          <h2>Room style</h2>
          ${[false, true].map((seasonal) => `${seasonal ? '<small class="muted">Seasonal</small>' : ''}<div class="room-styles">${Object.entries(ROOM_STYLES.STYLES).filter(([, st]) => !st.mood && !!st.seasonal === seasonal).map(([id, st]) => `
            <button class="${id === roomStyle ? 'selected' : ''}" data-room-style="${id}"><span>${esc(st.emoji)}</span>${esc(st.label)}</button>`).join('')}</div>`).join('')}
        </div>
        <p class="error">${esc(error)}</p>
        <button id="start">Start ${esc(game.name)}</button>`;
      ROOM_STYLES.apply(look());
      PB.layout($app, '.ls-l');

      const readNames = () => names.map((_, i) => document.getElementById(`name-${i}`).value.trim());
      document.getElementById('customize')?.addEventListener('click', () => {
        names = readNames();
        PB.editCustom(gameId, game.name, game.custom, () => renderSetup());
      });
      document.getElementById('add').onclick = () => { names = [...readNames(), `Player ${names.length + 1}`]; renderSetup(); };
      $app.querySelectorAll('[data-remove]').forEach((b) => {
        b.onclick = () => { const n = readNames(); n.splice(Number(b.dataset.remove), 1); names = n; renderSetup(); };
      });
      $app.querySelectorAll('[data-room-style]').forEach((b) => {
        b.onclick = () => {
          names = readNames();
          roomStyle = b.dataset.roomStyle;
          try { localStorage.setItem('local-room-style', roomStyle); } catch {}
          renderSetup();
        };
      });
      $app.querySelectorAll('[data-opt]').forEach((b) => {
        b.onclick = () => { names = readNames(); opts[b.dataset.opt] = JSON.parse(b.dataset.val); renderSetup(); };
      });
      document.getElementById('start').onclick = () => {
        const n = readNames();
        if (n.some((x) => !x)) return renderSetup('Every player needs a name.');
        if (new Set(n.map((x) => x.toLowerCase())).size !== n.length) return renderSetup('Each name must be different.');
        names = n;
        try { localStorage.setItem(storeKey, JSON.stringify({ names, opts })); } catch {}
        startGame();
      };
    }

    function startGame() {
      // Tonight's tab carries on from game to game on this page, by name.
      const before = Object.fromEntries((room?.players || lastPlayers).map((p) => [p.name, p]));
      room = {
        code: 'LOCAL',
        hostId: 'p0',
        players: names.map((name, i) => ({ id: `p${i}`, name, drinks: 0, connected: true, total: before[name]?.total || 0, finished: before[name]?.finished || 0 })),
        feed: [],
        game: { type: gameId },
        timer: null,
        deadline: null,
      };
      ctx = createContext({
        emit: (r, playerId, event, data) => {
          if (event !== 'drink') return;
          alerts.push({ who: nm(playerId), title: data.title || `DRINK ${data.sips} SIP${data.sips === 1 ? '' : 'S'}`, reason: data.reason || '' });
          showAlert();
        },
        broadcast: () => render(),
      });
      holder = null;
      const custom = __req('custom').clean(game.custom, PB.customFor(gameId));
      game.start(room, ctx, { ...opts, ...local.locked, custom });
      localGames += 1;
      // Every third game on this phone: water for everyone.
      if (__req('night').waterDue(localNight, gameId)) {
        const banner = document.createElement('div');
        banner.className = 'water-banner';
        banner.textContent = `💧 ${__req('water').waterLine(roomStyle)}`;
        banner.onclick = () => banner.remove();
        document.body.appendChild(banner);
        requestAnimationFrame(() => banner.classList.add('show'));
        setTimeout(() => banner.remove(), 7000);
      }
      window.Analytics?.event('local_game_started', { game: gameId, players: names.length });
      render();
      window.scrollTo(0, 0); // (the setup screen was scrolled down to its Start button)
    }

    // ---------- Game ----------

    function holderBar() {
      if (!local.switchable?.(room)) return '';
      const current = actorId();
      return `<div class="holder"><span>${esc(local.holderLabel || 'Whose cards?')}</span>${room.players.map((p) => `
        <button class="${p.id === current ? 'selected' : ''} ${local.hint?.(room, p.id) ? 'hint' : ''}" data-holder="${p.id}">${esc(p.name)}</button>`).join('')}</div>`;
    }

    function render() {
      if (!room) return;
      const me = actorId();
      const player = room.players.find((p) => p.id === me);
      const prev = PB.state;
      PB.state = {
        code: room.code,
        me,
        hostId: me, // whoever holds the phone can do the host's jobs (flipping, moving on)
        isHost: true,
        players: room.players.map(({ id, name, connected, drinks, total = 0, finished = 0 }) => ({ id, name, connected, drinks, total, finished })),
        phase: room.game.phase,
        gameType: gameId,
        gameNo: localGames,
        game: game.view(room, player, ctx),
        feed: room.feed.slice(-8),
        deadline: room.deadline,
        serverNow: Date.now(),
      };
      PB.track(PB.state);
      const screens = PB.screens[gameId];
      if (!screens) return;
      // Sound effects for what just happened (no "your turn" chime: the phone is being passed).
      if (prev?.gameType === gameId && prev.game) {
        const s = PB.state;
        const sounds = screens.sounds?.(prev, s) || [];
        if (s.phase === 'over' && prev.phase !== 'over') Prefs.play('win');
        else if (sounds.length) Prefs.play(sounds[0]);
      }
      const html = screens.render(PB.state);
      if (html === null) return;
      $app.innerHTML = `
        ${holderBar()}
        ${html}
        <div class="spacer"></div>
        <div class="game-foot">${PB.tabButton()}${Prefs.button()}<button class="link" data-cmd="setup">Back to setup</button></div>`;
      PB.layout($app, screens.stage);
      screens.afterRender?.(PB.state);
      updateTimer();
    }

    $app.addEventListener('click', (e) => {
      const el = e.target.closest('[data-act], [data-cmd], [data-holder]');
      if (!el || el.disabled) return;
      if (el.dataset.holder) { holder = el.dataset.holder; return render(); }
      if (el.dataset.confirm && !confirm(el.dataset.confirm)) return;
      const { act, cmd, confirm: _, ...data } = el.dataset;
      if (act) PB.act(act, data);
      else if (cmd === 'setup' || cmd === 'endGame') renderSetup();
    });

    function updateTimer() {
      const el = document.getElementById('timer');
      if (el && room?.deadline) el.textContent = `⏱ ${Math.max(0, Math.ceil((room.deadline - Date.now()) / 1000))}s`;
    }
    setInterval(updateTimer, 250);

    // Load the game's screens, then show setup.
    const script = document.createElement('script');
    script.src = `/games/${encodeURIComponent(gameId)}.js`;
    script.onload = () => renderSetup();
    document.head.appendChild(script);
  </script>
</body>
</html>
